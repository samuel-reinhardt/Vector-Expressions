name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Derive the plugin/theme slug from the repo name (lowercased).
      - name: Derive package slug
        id: slug
        run: |
          SLUG=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "Package slug: ${SLUG}"

      # Build two zips with the correct top-level folder name so WordPress
      # installs into wp-content/plugins/<slug>/ (not <RepoName>-<tag>/).
      #
      # Produces:
      #   <slug>-<version>-<YYYYMMDD>.zip  — versioned, date-stamped
      #   <slug>.zip                        — stable, non-versioned
      #
      # Both contain the same contents with the plain slug as the
      # internal folder name for WP compatibility.
      - name: Build release zips
        id: zip
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"
          VERSION="${GITHUB_REF_NAME:-unversioned}"
          DATESTAMP="$(date -u +'%Y%m%d')"

          VERSIONED_ZIP="${SLUG}-${VERSION}-${DATESTAMP}.zip"
          STABLE_ZIP="${SLUG}.zip"

          mkdir -p "/tmp/${SLUG}"
          rsync -a --exclude='.git' --exclude='.github' --exclude='assets' --exclude='scripts' --exclude='node_modules' ./ "/tmp/${SLUG}/"

          cd /tmp && zip -r "${VERSIONED_ZIP}" "${SLUG}"
          cp "${VERSIONED_ZIP}" "${STABLE_ZIP}"

          echo "versioned=/tmp/${VERSIONED_ZIP}" >> "$GITHUB_OUTPUT"
          echo "stable=/tmp/${STABLE_ZIP}" >> "$GITHUB_OUTPUT"

      # Delete the existing release (and all its assets) before recreating.
      # This prevents duplicate descriptions and stale zip files when
      # force-pushing a tag for the same version.
      - name: Delete existing release
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          BODY="📋 **[Changelog](${REPO_URL}/blob/main/CHANGELOG.md)**"

          gh release create "${{ github.ref_name }}" \
            "${{ steps.zip.outputs.versioned }}" \
            "${{ steps.zip.outputs.stable }}" \
            --title "${{ github.ref_name }}" \
            --notes "${BODY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
